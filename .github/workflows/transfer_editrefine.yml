name: Transfer EditRefine HF to ModelScope

on:
  workflow_dispatch:

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install clients
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade huggingface_hub modelscope-hub

      - name: Transfer EditRefine file by file
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}

        run: |
          python - <<'PY'
          import os
          import shutil
          import tempfile
          from pathlib import Path

          from huggingface_hub import (
              HfApi,
              RepoFile,
              hf_hub_download,
          )

          from modelscope_hub import HubApi


          # ==========================================================
          # 1. 基本配置
          # ==========================================================

          SRC_REPO = "Yixuan-Ding-ZJU/EditRefine"
          DST_REPO = "YTZ7AAS/EditRefine"

          HF_TOKEN = os.environ["HF_TOKEN"]
          MS_TOKEN = os.environ["MODELSCOPE_TOKEN"]


          print("=" * 80)
          print("EditRefine Transfer")
          print("=" * 80)
          print("SOURCE :", SRC_REPO)
          print("TARGET :", DST_REPO)
          print("=" * 80)


          # ==========================================================
          # 2. 初始化 API
          # ==========================================================

          hf_api = HfApi(
              token=HF_TOKEN
          )

          ms_api = HubApi(
              token=MS_TOKEN
          )


          # ==========================================================
          # 3. 验证 Hugging Face
          # ==========================================================

          print()
          print("Checking Hugging Face access...")

          hf_info = hf_api.model_info(
              repo_id=SRC_REPO,
              token=HF_TOKEN,
          )

          print(
              "Hugging Face OK:",
              hf_info.id
          )


          # ==========================================================
          # 4. 验证 ModelScope
          # ==========================================================

          print()
          print("Checking ModelScope access...")

          user = ms_api.whoami()

          print(
              "ModelScope user:",
              user.username
          )

          ms_api.get_repo(
              DST_REPO,
              "model",
          )

          print(
              "ModelScope repository OK:",
              DST_REPO
          )


          # ==========================================================
          # 5. 一个重要函数：
          #
          # ModelScope 新版本 list_repo_files() 返回 FileInfo
          # 而不是普通 str。
          #
          # 所以这里统一转换成文件路径字符串。
          # ==========================================================

          def normalize_repo_files(items):

              result = set()

              for item in items:

                  # 旧版本：直接返回字符串
                  if isinstance(item, str):
                      result.add(item)
                      continue

                  # 新版本 FileInfo
                  found = False

                  for attr in (
                      "path",
                      "name",
                      "file_path",
                      "filename",
                      "Path",
                      "Name",
                  ):

                      value = getattr(
                          item,
                          attr,
                          None,
                      )

                      if value:

                          value = str(value)

                          # 去除意外的开头 /
                          value = value.lstrip("/")

                          result.add(value)

                          found = True
                          break

                  # 如果对象支持 to_dict
                  if not found:

                      try:

                          data = item.to_dict()

                          for key in (
                              "path",
                              "name",
                              "file_path",
                              "filename",
                          ):

                              value = data.get(key)

                              if value:

                                  result.add(
                                      str(value).lstrip("/")
                                  )

                                  found = True
                                  break

                      except Exception:
                          pass


                  if not found:

                      print(
                          "WARNING: Cannot parse ModelScope FileInfo:"
                      )

                      print(
                          "  type =",
                          type(item)
                      )

                      print(
                          "  repr =",
                          repr(item)
                      )


              return result


          # ==========================================================
          # 6. 获取 Hugging Face 文件列表
          # ==========================================================

          print()
          print("Reading Hugging Face repository tree...")

          tree = list(
              hf_api.list_repo_tree(
                  repo_id=SRC_REPO,
                  repo_type="model",
                  recursive=True,
                  token=HF_TOKEN,
              )
          )


          files = [
              item
              for item in tree
              if isinstance(item, RepoFile)
          ]


          # 小文件优先，大权重后传
          files.sort(
              key=lambda x: x.size or 0
          )


          total_size = sum(
              item.size or 0
              for item in files
          )


          print()
          print(
              "HF file count:",
              len(files)
          )

          print(
              "HF total size:",
              f"{total_size / 1024**3:.3f} GiB"
          )


          print()
          print("=" * 80)
          print("SOURCE FILE LIST")
          print("=" * 80)


          for i, item in enumerate(
              files,
              1,
          ):

              size = (
                  (item.size or 0)
                  / 1024**3
              )

              print(
                  f"{i:03d}/{len(files):03d}  "
                  f"{size:8.3f} GiB  "
                  f"{item.path}"
              )


          # ==========================================================
          # 7. 获取 ModelScope 已有文件
          #
          # 这里是上次出错的地方。
          # 现在已经修正，不再直接 set(FileInfo)。
          # ==========================================================

          print()
          print("=" * 80)
          print("CHECK EXISTING MODELSCOPE FILES")
          print("=" * 80)


          try:

              raw_existing = ms_api.list_repo_files(
                  DST_REPO,
                  "model",
              )

              existing = normalize_repo_files(
                  raw_existing
              )

          except Exception as e:

              print(
                  "WARNING: list_repo_files failed:",
                  repr(e)
              )

              existing = set()


          print(
              "Existing ModelScope files:",
              len(existing)
          )


          for path in sorted(existing):

              print(
                  "  EXISTS:",
                  path
              )


          # ==========================================================
          # 8. 开始逐文件搬运
          # ==========================================================

          uploaded = 0
          skipped = 0
          failed = 0


          for index, item in enumerate(
              files,
              1,
          ):

              remote_path = (
                  item.path
                  .lstrip("/")
              )

              file_size = (
                  item.size or 0
              )


              print()
              print("=" * 80)
              print(
                  f"[{index}/{len(files)}]"
              )
              print(
                  "FILE:",
                  remote_path
              )
              print(
                  "SIZE:",
                  f"{file_size / 1024**3:.3f} GiB"
              )


              # ======================================================
              # 已经存在就跳过
              # ======================================================

              if remote_path in existing:

                  print(
                      "SKIP: already exists on ModelScope"
                  )

                  skipped += 1

                  continue


              # ======================================================
              # 检查 runner 剩余空间
              # ======================================================

              disk = shutil.disk_usage(
                  "/"
              )

              free_gib = (
                  disk.free
                  / 1024**3
              )

              print(
                  "Runner free disk:",
                  f"{free_gib:.2f} GiB"
              )


              # 至少给系统留 2 GiB
              required = (
                  file_size
                  + 2 * 1024**3
              )


              if disk.free < required:

                  raise RuntimeError(
                      "Not enough runner disk space. "
                      f"File={file_size/1024**3:.2f} GiB, "
                      f"Free={free_gib:.2f} GiB"
                  )


              # ======================================================
              # 每个文件使用独立临时目录
              # ======================================================

              temp_dir = Path(
                  tempfile.mkdtemp(
                      prefix="editrefine_transfer_",
                      dir="/tmp",
                  )
              )


              try:

                  # ==================================================
                  # 9. 从 HF 下载这个文件
                  # ==================================================

                  print()
                  print(
                      "Downloading from Hugging Face..."
                  )


                  local_path = hf_hub_download(
                      repo_id=SRC_REPO,
                      repo_type="model",
                      filename=remote_path,
                      token=HF_TOKEN,
                      local_dir=str(temp_dir),
                  )


                  local_path = Path(
                      local_path
                  )


                  if not local_path.exists():

                      raise RuntimeError(
                          "HF download did not create file: "
                          + str(local_path)
                      )


                  downloaded_size = (
                      local_path
                      .stat()
                      .st_size
                  )


                  print(
                      "HF DOWNLOAD OK"
                  )

                  print(
                      "Local file:",
                      local_path
                  )

                  print(
                      "Downloaded size:",
                      f"{downloaded_size / 1024**3:.3f} GiB"
                  )


                  # ==================================================
                  # 10. 上传到 ModelScope
                  # ==================================================

                  print()
                  print(
                      "Uploading to ModelScope..."
                  )


                  ms_api.upload_file(
                      DST_REPO,
                      "model",
                      str(local_path),
                      remote_path,
                  )


                  print()
                  print(
                      "UPLOAD OK:",
                      remote_path
                  )


                  uploaded += 1

                  # 本轮成功后加入 existing
                  # 防止同一个 workflow 中重复
                  existing.add(
                      remote_path
                  )


              except Exception as e:

                  failed += 1

                  print()
                  print(
                      "TRANSFER FAILED:",
                      remote_path
                  )

                  print(
                      "ERROR:",
                      repr(e)
                  )

                  raise


              finally:

                  # ==================================================
                  # 11. 每完成一个文件立即清理
                  # ==================================================

                  print()
                  print(
                      "Cleaning temporary files..."
                  )


                  shutil.rmtree(
                      temp_dir,
                      ignore_errors=True,
                  )


                  # HF 有时会产生缓存
                  for cache in (
                      Path.home() / ".cache/huggingface",
                      Path("/tmp/huggingface"),
                  ):

                      if cache.exists():

                          shutil.rmtree(
                              cache,
                              ignore_errors=True,
                          )


                  disk_after = shutil.disk_usage(
                      "/"
                  )


                  print(
                      "Free disk after cleanup:",
                      f"{disk_after.free / 1024**3:.2f} GiB"
                  )


          # ==========================================================
          # 12. 所有文件循环结束
          # ==========================================================

          print()
          print("=" * 80)
          print("TRANSFER LOOP FINISHED")
          print("=" * 80)

          print(
              "Uploaded this run:",
              uploaded
          )

          print(
              "Skipped:",
              skipped
          )

          print(
              "Failed:",
              failed
          )


          # ==========================================================
          # 13. 最终重新读取 ModelScope 文件
          #
          # 这里也是上次报错的地方。
          # 已经改成 normalize_repo_files()
          # ==========================================================

          print()
          print(
              "Refreshing ModelScope repository file list..."
          )


          raw_final = ms_api.list_repo_files(
              DST_REPO,
              "model",
          )


          final_files = normalize_repo_files(
              raw_final
          )


          src_files = {
              item.path.lstrip("/")
              for item in files
          }


          missing = sorted(
              src_files
              - final_files
          )


          extra = sorted(
              final_files
              - src_files
          )


          print()
          print("=" * 80)
          print("FINAL VERIFICATION")
          print("=" * 80)

          print(
              "Source file count:",
              len(src_files)
          )

          print(
              "Target file count:",
              len(final_files)
          )

          print(
              "Missing:",
              len(missing)
          )

          print(
              "Extra:",
              len(extra)
          )


          if missing:

              print()
              print(
                  "MISSING FILES:"
              )

              for path in missing:

                  print(
                      "  MISSING:",
                      path
                  )


              raise RuntimeError(
                  f"Transfer incomplete: "
                  f"{len(missing)} source files "
                  "are missing from ModelScope"
              )


          # ==========================================================
          # 14. 成功
          # ==========================================================

          print()
          print("=" * 80)
          print("SUCCESS")
          print("=" * 80)
          print(
              "All Hugging Face files are present on ModelScope."
          )
          print(
              "Source:",
              SRC_REPO
          )
          print(
              "Target:",
              DST_REPO
          )
          print("=" * 80)

          PY
